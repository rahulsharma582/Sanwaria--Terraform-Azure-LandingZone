name: Main Branch CD

on:

  push:

    branches:

      - main

jobs:

  terraform:

    runs-on: ubuntu-latest

    environment: Production

    steps:

    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Format
      run: terraform fmt 
      working-directory: enviornments/prod
      
    - name: Terraform Init
      run: terraform init
      working-directory: enviornments/prod
      
    - name: Terraform Validate
      run: terraform validate
      working-directory: enviornments/prod

    - name: Azure Login
      uses: azure/login@v2
      with:
       creds: ${{ secrets.azure_cred123 }}
      
    - name: Terraform Plan
      run: terraform plan
      working-directory: enviornments/prod

  
    - name: Apply
      working-directory:  enviornments/prod
      run: terraform apply -auto-approve 
